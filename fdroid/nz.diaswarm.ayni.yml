# F-Droid metadata for the follower.
#
# This file does not live here in the end — it belongs in fdroiddata as
# `metadata/nz.diaswarm.ayni.yml`, submitted as a merge request to
# https://gitlab.com/fdroid/fdroiddata. It is kept in this repository so the
# recipe that builds a published binary is versioned alongside the source it
# builds, and so it can be reviewed here before being proposed there.
#
# WHAT IS PUBLISHED AND WHAT IS NOT. This is the follower: it shows somebody
# else's glucose and contains no loop code at all. The AndroidAPS add-on that
# publishes a loop's records is NOT distributed, here or anywhere — running a
# loop means assembling a medical device yourself, from source you have read.

Categories:
  - Sports & Health
License: AGPL-3.0-only
AuthorName: alex-poor
SourceCode: https://github.com/alex-poor/diaswarm
IssueTracker: https://github.com/alex-poor/diaswarm/issues

AutoName: Ayni

Summary: See the glucose of someone who shares it with you

Description: |-
    Shows the glucose of somebody who has chosen to share it with you.

    Ayni is a Quechua word for reciprocity — help given and returned over time.
    It is the shape of the network underneath: your phone carries other people's
    sealed records so that theirs carry yours when your phone is off or away,
    and no phone can read what it holds for anyone else.

    It is a viewer and nothing else. It cannot deliver insulin, it contains no
    closed-loop code, and it does not talk to a pump. If you are looking for an
    artificial pancreas, this is not it and does not include one.

    Readings travel directly between phones. There is no account, no server
    holding your data, and nobody in the middle who can read it: records are
    sealed on the sender's phone before they are sent, and only somebody they
    have granted a key to can open them. Sharing is withdrawn by stopping the
    key, not by asking a service to stop serving.

    Pairing is one scan. The person sharing scans the follower's code; their
    phone grants access and hands back its own address in the same movement.

    Every reading is shown with its age. A follower's dangerous failure is not
    an error on screen — it is a number that looks current and is nine hours
    old.

    To share your own data you need the AndroidAPS add-on from the project's
    repository, which you build yourself. It is deliberately not distributed.

    A relay is used to introduce two phones that are on different networks. It
    carries encrypted traffic it cannot read and holds nothing, but it does see
    which node identifiers exchange bytes and when. The relay is chosen by the
    person sharing and travels in their invite, so it can be one they run.

RepoType: git
Repo: https://github.com/alex-poor/diaswarm.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: follower-v0.1.0
    subdir: follower
    sudo:
      - apt-get update
      - apt-get install -y rustup
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - cargo install cargo-ndk --locked
    ndk: 29.0.14206865
    gradle:
      - yes
    # The record core is Rust, compiled here into the .so the app loads. It is
    # built from source in this repository and never committed — a checked-in
    # binary would be an opaque second copy of a frozen specification, and the
    # scanner would rightly reject it.
    prebuild: echo "sdk.dir=$$SDK$$" > local.properties

AutoUpdateMode: Version follower-v%v
UpdateCheckMode: Tags ^follower-v
CurrentVersion: 0.1.0
CurrentVersionCode: 1
