# F-Droid metadata for the follower.
#
# This file does not live here in the end — it belongs in fdroiddata as
# `metadata/nz.diaswarm.ayni.yml`, submitted as a merge request to
# https://gitlab.com/fdroid/fdroiddata. It is kept in this repository so the
# recipe that builds a published binary is versioned alongside the source it
# builds, and so it can be reviewed here before being proposed there.
#
# WHAT IS PUBLISHED AND WHAT IS NOT. This is the follower: it shows somebody
# else's glucose and contains no loop code at all. The AndroidAPS add-on that
# publishes a loop's records is NOT distributed, here or anywhere — running a
# loop means assembling a medical device yourself, from source you have read.

# HEALTH MANAGER, NOT MEDICATION — asked on the merge request. `Medication` in
# fdroiddata is pill reminders and dose logs; this records and reminds about
# nothing. The only two diabetes apps already published there, `it.diab` and
# `org.glucosio.android`, both carry exactly this pair.
Categories:
  - Health Manager
  - Sports & Health
License: AGPL-3.0-only
AuthorName: alex-poor
SourceCode: https://github.com/alex-poor/diaswarm
IssueTracker: https://github.com/alex-poor/diaswarm/issues

# NO Summary OR Description HERE. F-Droid asks authors to keep those with the
# source, where they can be corrected without opening a merge request, so they
# live in fastlane/metadata/android/en-US/ in the app's own repository and are
# read out of the build. The same directory carries the 512px icon, which is
# what F-Droid displays — the icon inside the APK is an adaptive-icon XML and
# their indexer will not use one.
AutoName: Ayni

RepoType: git
Repo: https://github.com/alex-poor/diaswarm.git

# EARLIER TAGS ARE DELIBERATELY ABSENT. The source repository has
# `follower-v0.1.0` (built before the app was named, under a different
# applicationId — a different application as far as Android is concerned) and
# `follower-v0.1.1` (one APK carrying both ABIs). Neither is offered here; the
# first version F-Droid publishes is 0.1.2.
#
# BUILDING THE RUST CORE HERE, TWO THINGS THAT ARE EASY TO GET WRONG:
#
#   * `gcc` and `libc-dev` are for the HOST, not the phone. cargo-ndk is itself
#     a Rust program with build scripts, and the buildserver image ships no C
#     toolchain, so without them `cargo install` dies with "linker `cc` not
#     found" before any Android code is reached. Measured, in a failed run.
#   * The toolchain is set up in `prebuild`, not in `sudo`. `sudo:` runs as
#     root, so a cargo-ndk installed there lands in root's ~/.cargo/bin and is
#     not on the PATH of the user who runs gradle.
#
# The .so is built from source here and never committed: a checked-in binary
# would be an opaque second copy of a frozen specification, and the scanner
# would rightly reject it.
#
# TWO APKS PER RELEASE, ONE PER ABI. The app's native half is a Rust library
# that is 15.7 MB for arm64 and 10.1 MB for armv7, stored uncompressed so it can
# be mapped straight out of the APK. Carrying both made every phone download
# about 10 MB of an architecture it would never run, so `assembleRelease`
# produces one APK per ABI and each build entry below picks one with `output`.
#
# The versionCodes are the app's base versionCode times ten, plus one per ABI —
# arm64 last, so that a device offered both takes the 64-bit build. If that
# arithmetic ever drifts from the numbers declared here, this build fails rather
# than publishing an APK that claims a version it does not have.
#
# The base is 7 AT THE PINNED COMMIT below, which is what this file builds.
# HEAD has since moved to 8 (0.1.7) and that is not a drift — these entries are
# pinned to a hash on purpose, so they keep building 0.1.6 no matter where the
# branch goes.
Builds:
  - versionName: 0.1.6
    versionCode: 71
    commit: 2e55f2bc1290f06d38ba71fcebfb00e26e5f381f
    subdir: follower
    sudo:
      - apt-get update
      - apt-get install -y rustup gcc libc-dev
    ndk: r29
    gradle:
      - yes
    output: build/outputs/apk/release/ayni-armeabi-v7a-release-unsigned.apk
    # The record core is Rust, compiled here into the .so the app loads. It is
    # built from source in this repository and never committed — a checked-in
    # binary would be an opaque second copy of a frozen specification, and the
    # scanner would rightly reject it.
    prebuild:
      - echo "sdk.dir=$$SDK$$" > local.properties
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - cargo install cargo-ndk@4.1.2 --locked

  - versionName: 0.1.6
    versionCode: 72
    commit: 2e55f2bc1290f06d38ba71fcebfb00e26e5f381f
    subdir: follower
    sudo:
      - apt-get update
      - apt-get install -y rustup gcc libc-dev
    ndk: r29
    gradle:
      - yes
    output: build/outputs/apk/release/ayni-arm64-v8a-release-unsigned.apk
    prebuild:
      - echo "sdk.dir=$$SDK$$" > local.properties
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - cargo install cargo-ndk@4.1.2 --locked

# CHECKED AUTOMATICALLY, WRITTEN BY HAND.
#
# `VercodeOperation` IS NOT OPTIONAL, even with auto-update off. The update
# check reads the versionCode out of build.gradle.kts — the base, 7 — and
# compares it with `CurrentVersionCode`. Without these two operations to
# reproduce the per-ABI arithmetic it reports `current version is newer: old
# vercode=72, new vercode=7` and fails on every run. Measured with
# `fdroid checkupdates`, not assumed.
#
# **AUTO-UPDATE IS ON, AND THE REASON IT WAS OFF WAS WRONG.** This used to say
# auto-update would copy one build entry per operation and give every copy the
# same `output` glob, so both entries would publish the same ABI. It does not:
# `fdroid` clones the trailing *set* of entries, one per `VercodeOperation`,
# each keeping its own `output`. `rs.ruffle` in fdroiddata does exactly this
# across four ABIs and 192 generated entries.
#
# That claim was written from inference rather than from an example, and an
# F-Droid maintainer had to ask twice before anyone checked. Finding the
# counter-example took two minutes.
# ⚠️ A TAG IS A RELEASE. With auto-update on and the check set to tags, pushing
# `follower-v0.1.7` is what puts 0.1.7 in front of users — there is no second
# confirmation step. Do not tag a version until it has actually run on a phone.
AutoUpdateMode: Version
UpdateCheckMode: Tags ^follower-v
VercodeOperation:
  - "%c * 10 + 1"
  - "%c * 10 + 2"
CurrentVersion: 0.1.6
CurrentVersionCode: 72
