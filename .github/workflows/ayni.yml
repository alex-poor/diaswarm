# Build the follower app.
#
# ONE REPOSITORY, NO ANDROIDAPS. The follower used to be a flavour of AAPS with
# the dosing stripped out, which meant this workflow checked out a second repo,
# built a whole loop app, and had to actively refuse to publish the pump variant.
# The follower is now its own application containing no AAPS code at all, so
# none of that applies: there is nothing here that could build a loop.
#
# That is also what makes it publishable. F-Droid builds one repository from
# source, and this is one repository whose only unusual need is a Rust toolchain
# to compile the record core into a .so — which is built here, never committed.

name: ayni apk

on:
  workflow_dispatch:
  push:
    tags: ["follower-v*"]
  pull_request:
    paths: ["follower/**", "crates/**", ".github/workflows/ayni.yml"]

permissions:
  contents: write   # only to attach the apk to a release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FOLLOWER_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          [ -n "$NDK" ] && [ -d "$NDK" ] || { echo "::error::no NDK on the runner"; exit 1; }
          echo "using NDK at $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Rust for Android
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            crates/*/target
          key: follower-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'follower/**/*.gradle*') }}
          restore-keys: follower-${{ runner.os }}-

      # The record core is asserted byte-identical to tools/canon.py over real
      # data; if that is broken there is no point building an app around it.
      - name: Test the record core
        working-directory: crates/diaswarm-core
        run: cargo test

      - name: Build
        working-directory: follower
        run: ./gradlew assembleRelease --console=plain

      # ONE APK PER ABI, so every one of them is signed. `head -1` here used to
      # be harmless because there was only ever one file; with splits it would
      # quietly publish a single architecture and drop the other.
      #
      # Signed only when a key is configured. Without one the run still produces
      # artifacts — unsigned, so installable by nobody and reviewable by
      # anybody, which is right for a fork or a pull request.
      - name: Sign
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.FOLLOWER_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FOLLOWER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOLLOWER_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FOLLOWER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > /tmp/follower.jks
          for IN in follower/build/outputs/apk/release/*-release-unsigned.apk; do
            NAME=$(basename "$IN")
            case "$NAME" in
              ayni-?*-release-unsigned.apk) ;;
              *) echo "::error::unexpected apk name $NAME — refusing to guess its ABI"; exit 1 ;;
            esac
            ABI=${NAME#ayni-}; ABI=${ABI%-release-unsigned.apk}
            "${BT}zipalign" -f -p 4 "$IN" "/tmp/aligned-$ABI.apk"
            "${BT}apksigner" sign \
              --ks /tmp/follower.jks --ks-pass "env:KS_PASS" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "env:KEY_PASS" \
              --out "ayni-$ABI.apk" "/tmp/aligned-$ABI.apk"
          done
          shred -u /tmp/follower.jks
          for A in ayni-*.apk; do
            echo "== $A  $(stat -c%s "$A") bytes"
            "${BT}apksigner" verify --print-certs "$A"
          done | tee signer.txt

      - name: Name the unsigned builds for what they are
        if: env.HAS_KEY != 'true'
        run: |
          set -euo pipefail
          for IN in follower/build/outputs/apk/release/*-release-unsigned.apk; do
            NAME=$(basename "$IN"); ABI=${NAME#ayni-}; ABI=${ABI%-release-unsigned.apk}
            cp "$IN" "ayni-$ABI-UNSIGNED.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ayni
          path: |
            ayni*.apk
            signer.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          **Ayni** shows the glucose of somebody who shares it with you.

          **It cannot dose, and contains no loop code.**

          **Which file?** \`ayni-arm64-v8a.apk\` — that is every Android phone sold
          for years, and it is the one to take unless you know otherwise.
          \`ayni-armeabi-v7a.apk\` is for older 32-bit ARM devices; if the first one
          says the app is not compatible, take this one instead. They are one
          release built for two architectures, not two versions. Installing from
          F-Droid picks for you.

          This is not AndroidAPS and does not contain it. To share your own data you
          need the AAPS add-on, which you build yourself — this repository does not
          distribute a loop and never will.

          Built from \`${GITHUB_SHA}\`.
          EOF
          # Titled by the app's name, not the tag's. The tag prefix stays
          # `follower-v` because F-Droid's UpdateCheckMode matches on it and a
          # changed prefix would silently stop it seeing new versions.
          gh release create "${GITHUB_REF_NAME}" ayni*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Ayni ${GITHUB_REF_NAME#follower-v}" --notes-file notes.md
