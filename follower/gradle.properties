org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
android.useAndroidX=true
kotlin.code.style=official

# KEEP RESOURCE PATHS READABLE. AGP's resource optimiser rewrites every file in
# the APK to a two-character name — res/mipmap-xhdpi/ic_launcher.png becomes
# res/BW.png — which saves a few kilobytes of string table and makes the
# launcher icon undiscoverable to anything that looks for it by path. F-Droid's
# indexer does exactly that, and separately refuses an icon that resolves to an
# adaptive-icon XML, so with the optimiser left on the published app has no
# icon at all on their site. Measured, then set: the cost is 7,871 bytes.
#
# AGP 9 REMOVES THIS OPTION. When that happens the in-APK icon becomes
# undiscoverable again and fastlane/metadata/android/en-US/images/icon.png —
# which is the documented route and already in place — is what carries it.
android.enableResourceOptimizations=false
