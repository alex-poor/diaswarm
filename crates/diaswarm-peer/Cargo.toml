[package]
name = "diaswarm-peer"
# TRACKS THE FOLLOWER'S PROTOCOL GENERATION, NOT ITS OWN HISTORY. `peer-v0.1.0`
# was cut at 924eb18 (2026-09-15), before the follower-v0.1.7 wire changes
# (diaswarm-keys/wire.rs, scoped grants, the invite handle field). A peer built
# from that tag cannot follow or carry for a 0.1.7 phone. Jumping straight to
# 0.1.7 so `--version` names the protocol generation it is actually compatible
# with — an 0.1.1..0.1.6 peer never existed, and a peer that claimed one would
# imply a lineage of carrier releases that was never built.
#
# 0.1.8 is the one exception to "tracks the protocol generation": the follower
# generation did NOT move (PROTOCOL_VERSION is still 1 — two peers meet and sync
# exactly as before), but the invite STRING format grew the compact base64url v5
# and 0.1.7 cannot parse an invite that says `5`. Shipping a second binary also
# called 0.1.7 — one that reads v5, one that does not — is a worse bug than a
# point bump, so this is a within-generation patch: same wire, adds v5 invite
# parsing and a terminal QR.
version = "0.1.9"
edition = "2021"
publish = false
description = "An always-on diaswarm pool member for a machine that does not sleep"
license = "AGPL-3.0-only"

# ITS OWN CRATE, AND THE REASON IS THE VERSION NUMBER. This used to be a bin
# inside `diaswarm-net` alongside `keyspeer`, `keyswatch` and `poolpeer`, which
# are test instruments — they run for N seconds, print JSON for a test to read,
# and exit. This is the one that is meant to be downloaded and left running, so
# it needs a version somebody can quote in a bug report, and a release artifact
# has to come from something with a version of its own.

[[bin]]
name = "diaswarm-peer"
path = "src/main.rs"

[dependencies]
diaswarm-net = { path = "../diaswarm-net" }
diaswarm-keys = { path = "../diaswarm-keys" }
# For `Record`, which is what a read hands back and an export writes out.
diaswarm-core = { path = "../diaswarm-core" }
p2panda-core = "=0.7.1"
# For asking the store what it actually holds, rather than trusting a counter.
p2panda-store = { version = "=0.7.1", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
anyhow = "1"
# ARGUMENT PARSING IS NOT A THING TO HAND-ROLL. The first version of this had
# its own `fn arg(args, name)` and no `--help` and no `--version`, which is
# three bespoke things where one dependency does the job — and the standing
# preference in this project is explicit about that trade.
clap = { version = "4", features = ["derive"] }
# SMART Health Links: JWE compact with alg=dir, enc=A256GCM. Both are already in
# this workspace's tree via diaswarm-keys, so this adds no new supply chain --
# and AES-GCM is emphatically not a thing to hand-roll.
aes-gcm = "0.10"
base64 = "0.22"
# A scannable invite in the terminal: this is the no-UI member of the three, so
# its "show my invite" is a QR printed to stderr. Pure Rust, like everything
# else here — a QR encoder is exactly the kind of thing not to hand-roll.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# TO PARSE WHAT WE EMIT. A bundle that is not valid JSON is not a bundle, and
# asserting on substrings would not catch it.
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Leak-fix fork of p2panda-sync 0.7.1 (session-channel reaping). Only this one
# dep is patched so a carrier RSS run isolates the fix vs the stock-deps baseline.
[patch.crates-io]
p2panda-sync = { path = "../../vendor/p2panda-sync" }
