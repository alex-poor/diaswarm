[package]
name = "diaswarm-net"
version = "0.1.0"
edition = "2021"
publish = false
description = "Move a vault between peers over iroh"

[dependencies]
diaswarm-core = { path = "../diaswarm-core" }
diaswarm-keys = { path = "../diaswarm-keys" }
iroh = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# D2a: the moment two devices must sync, p2panda-net over iroh is the answer.
p2panda-net = "=0.7.1"
p2panda-core = "=0.7.1"
p2panda-store = { version = "=0.7.1", features = ["macros"] }
p2panda-sync = "=0.7.1"
futures-util = "0.3"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
p2panda-encryption = "=0.7.1"
# Only to reopen a carrier's store and assert its encryption-state tables stay
# empty (keys_replicate.rs). Same version/features p2panda-store already pulls,
# so it unifies rather than adding a second sqlx.
sqlx = { version = "=0.8.6", features = ["runtime-tokio", "sqlite"] }

# **IROH IS VENDORED AND PATCHED HERE.** Not a fork for its own sake: upstream
# grows `pending_open_paths` geometrically until the allocator fails, which is
# what has been killing the follower overnight. One deduplicating function,
# taken verbatim from the maintainer-facing hot-fix in iroh#4390, both of whose
# issues are still open. `vendor/iroh/DIASWARM-PATCH.md` has the measurements
# and the instructions for removing this again.
[patch.crates-io]
iroh = { path = "../../vendor/iroh" }
