[package]
name = "diaswarm-net"
version = "0.1.0"
edition = "2021"
publish = false
description = "Move a vault between peers over iroh"

[dependencies]
diaswarm-core = { path = "../diaswarm-core" }
iroh = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
